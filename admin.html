<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Administrador - Verificación Digital</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body {
  font-family: Arial, sans-serif;
  background: #eef2f7;
  margin: 0;
  padding: 20px;
}

h1 {
  text-align: center;
  color: #003366;
}

#contenedor {
  max-width: 1100px;
  margin: 20px auto;
  background: white;
  padding: 20px;
  border-radius: 10px;
  box-shadow: 0 0 10px rgba(0,0,0,.15);
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 20px;
}

th,
td {
  border: 1px solid #ddd;
  padding: 10px;
  text-align: left;
}

th {
  background: #003366;
  color: white;
}

select {
  padding: 7px;
}

#mensaje {
  padding: 12px;
  margin-bottom: 15px;
  background: #f1f1f1;
  border-radius: 6px;
}

@media (max-width: 700px) {

  #contenedor {
    overflow-x: auto;
  }

  table {
    min-width: 750px;
  }

}

</style>
</head>

<body>

<h1>Administrador de Verificación Digital</h1>

<div id="contenedor">

  <div id="mensaje">
    Cargando solicitudes...
  </div>

  <table>

    <thead>
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Correo</th>
        <th>Teléfono</th>
        <th>Motivo</th>
        <th>Estado</th>
        <th>Fecha</th>
      </tr>
    </thead>

    <tbody id="tabla">
    </tbody>

  </table>

</div>

<script>

const SUPABASE_URL = "TU_SUPABASE_URL";
const SUPABASE_ANON_KEY = "TU_SUPABASE_PUBLISHABLE_KEY";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );

async function cargarRegistros() {

  const mensaje = document.getElementById("mensaje");
  const tabla = document.getElementById("tabla");

  const { data, error } = await supabaseClient
    .from("usuario_verificaciones")
    .select("*")
    .order("fecha", { ascending: false });

  if (error) {

    console.error(error);

    mensaje.textContent =
      "No se pudieron cargar las solicitudes.";

    return;
  }

  tabla.innerHTML = "";

  if (!data || data.length === 0) {

    mensaje.textContent =
      "No hay solicitudes todavía.";

    return;
  }

  mensaje.textContent =
    "Solicitudes recibidas: " + data.length;

  data.forEach(function(r) {

    const fila = document.createElement("tr");

    fila.innerHTML = `
      <td>${r.id ?? ""}</td>
      <td>${r.nombre ?? ""}</td>
      <td>${r.correo ?? ""}</td>
      <td>${r.telefono ?? ""}</td>
      <td>${r.motivo ?? ""}</td>
      <td>${r.estado ?? "Pendiente"}</td>
      <td>${r.fecha ?? ""}</td>
    `;

    tabla.appendChild(fila);

  });

}

cargarRegistros();

</script>

</body>
</html>
