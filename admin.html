<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Verificación Digital</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  body {
    font-family: Arial, sans-serif;
    background: #eef2f7;
    margin: 0;
    padding: 20px;
  }

  h1 {
    text-align: center;
    color: #003366;
  }

  form {
    max-width: 450px;
    margin: 25px auto;
    background: #fff;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0,0,0,.15);
  }

  label {
    display: block;
    margin-top: 15px;
    font-weight: bold;
  }

  input {
    width: 100%;
    box-sizing: border-box;
    padding: 11px;
    margin-top: 6px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 15px;
  }

  button {
    margin-top: 22px;
    padding: 13px;
    background: #003366;
    color: #fff;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    width: 100%;
    font-size: 16px;
  }

  button:disabled {
    background: #888;
    cursor: not-allowed;
  }

  #mensaje {
    max-width: 450px;
    margin: 15px auto;
    padding: 12px;
    border-radius: 6px;
    text-align: center;
    display: none;
  }

  .ok {
    background: #d9f7df;
    color: #176b2c;
  }

  .error {
    background: #ffdede;
    color: #9b0000;
  }
</style>
</head>

<body>

<h1>Verificación Digital</h1>

<form id="form">

  <label>
    Nombre
    <input type="text" name="nombre" required>
  </label>

  <label>
    Correo electrónico
    <input type="email" name="correo" required>
  </label>

  <label>
    Teléfono
    <input type="tel" name="telefono" required>
  </label>

  <label>
    Motivo de la verificación
    <input type="text" name="motivo" required>
  </label>

  <button type="submit" id="boton">
    Enviar solicitud
  </button>

</form>

<div id="mensaje"></div>

<script>
const SUPABASE_URL = "https://iomxopcdoygphvulaswb.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_4KqCEnqLVSEETOob_X9c7w_4IOpToI-";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );

const form = document.getElementById("form");
const boton = document.getElementById("boton");
const mensaje = document.getElementById("mensaje");

function mostrarMensaje(texto, tipo) {
  mensaje.textContent = texto;
  mensaje.className = tipo;
  mensaje.style.display = "block";
}

form.addEventListener("submit", async function(e) {

  e.preventDefault();

  boton.disabled = true;
  boton.textContent = "Enviando...";

  mensaje.style.display = "none";

  const registro = {
    nombre: form.nombre.value.trim(),
    correo: form.correo.value.trim(),
    telefono: form.telefono.value.trim(),
    motivo: form.motivo.value.trim(),
    estado: "Pendiente",
    fecha: new Date().toISOString()
  };

  try {

    const { error } = await supabaseClient
      .from("usuario_verificaciones")
      .insert([registro]);

    if (error) {
      console.error(error);

      mostrarMensaje(
        "No se pudo enviar la solicitud. Inténtalo nuevamente.",
        "error"
      );

      return;
    }

    form.reset();

    mostrarMensaje(
      "Solicitud enviada correctamente. Será revisada por el administrador.",
      "ok"
    );

  } catch (error) {

    console.error(error);

    mostrarMensaje(
      "Ocurrió un error de conexión.",
      "error"
    );

  } finally {

    boton.disabled = false;
    boton.textContent = "Enviar solicitud";

  }

});
</script>

</body>
</html>
