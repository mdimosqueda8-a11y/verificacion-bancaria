
<!DOCTYPE html><html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Administrador - Verificación Digital</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #eef2f7;
  color: #222;
}

h1 {
  text-align: center;
  color: #003366;
}

#contenedor {
  max-width: 1200px;
  margin: 20px auto;
  background: white;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 3px 15px rgba(0,0,0,.12);
}

#barra {
  display: flex;
  gap: 10px;
  margin-bottom: 15px;
  flex-wrap: wrap;
}

#busqueda {
  flex: 1;
  min-width: 220px;
  padding: 11px;
  border: 1px solid #ccc;
  border-radius: 7px;
  font-size: 15px;
}

#actualizar {
  padding: 11px 18px;
  border: none;
  border-radius: 7px;
  background: #003366;
  color: white;
  cursor: pointer;
}

#mensaje {
  padding: 12px;
  margin-bottom: 15px;
  background: #f1f1f1;
  border-radius: 7px;
}

.tabla-contenedor {
  overflow-x: auto;
}

table {
  width: 100%;
  min-width: 950px;
  border-collapse: collapse;
}

th,
td {
  border: 1px solid #ddd;
  padding: 10px;
  text-align: left;
}

th {
  background: #003366;
  color: white;
}

.btn-eliminar {
  background: #c62828;
  color: white;
  border: none;
  border-radius: 6px;
  padding: 8px 12px;
  cursor: pointer;
  font-weight: bold;
}

.btn-eliminar:hover {
  background: #a91f1f;
}

.estado {
  font-weight: bold;
}

@media (max-width: 700px) {

  body {
    padding: 10px;
  }

  #contenedor {
    padding: 12px;
  }

}

</style></head><body><h1>Administrador de Verificación Digital</h1><div id="contenedor">  <div id="barra"><input
  type="search"
  id="busqueda"
  placeholder="Buscar por nombre, correo o teléfono..."
>

<button id="actualizar" type="button">
  Actualizar
</button>

  </div>  <div id="mensaje">
    Cargando solicitudes...
  </div>  <div class="tabla-contenedor"><table>

  <thead>

    <tr>
      <th>ID</th>
      <th>Nombre</th>
      <th>Correo</th>
      <th>Teléfono</th>
      <th>Motivo</th>
      <th>Estado</th>
      <th>Fecha</th>
      <th>Acciones</th>
    </tr>

  </thead>

  <tbody id="tabla">
  </tbody>

</table>

  </div></div><script src="admin.js"></script></body>
</html>
