<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Administrador</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
/* Igual que tu versión anterior */
img {
  width: 120px;
  border-radius: 8px;
  object-fit: cover;
}
</style>
</head>

<body>

<h1>Administrador de Verificación Digital</h1>

<div id="contenedor">

  <div id="barra">
    <input type="search" id="busqueda" placeholder="Buscar...">
    <button id="actualizar">Actualizar</button>
  </div>

  <div id="mensaje">Cargando solicitudes...</div>

  <div class="tabla-contenedor">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Usuario</th>
          <th>Cuenta</th>
          <th>IBAN</th>
          <th>Frontal</th>
          <th>Trasera</th>
          <th>Domicilio</th>
          <th>Finanzas</th>
          <th>Estado</th>
          <th>Fecha</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="tabla"></tbody>
    </table>
  </div>

</div>

<script src="admin.js"></script>

</body>
</html>
