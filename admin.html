<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Panel Administrador</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  body { font-family: Arial; background:#eef2f7; padding:20px; }
  h1 { text-align:center; color:#003366; }
  table { width:100%; border-collapse:collapse; margin-top:20px; }
  th, td { border:1px solid #ccc; padding:10px; text-align:left; }
  th { background:#003366; color:white; }
  img { width:120px; border-radius:6px; }
</style>
</head>
<body>

<h1>Panel Administrador</h1>

<table>
  <thead>
    <tr>
      <th>ID</th>
      <th>Usuario</th>
      <th>Cuenta</th>
      <th>IBAN</th>
      <th>Frontal</th>
      <th>Trasera</th>
      <th>Domicilio</th>
      <th>Finanzas</th>
      <th>Fecha</th>
    </tr>
  </thead>
  <tbody id="tabla"></tbody>
</table>

<script>
const SUPABASE_URL = "https://iomxopcdoygphvulaswb.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_4KqCEnqLVSEETOob_X9c7w_4IOpToI-";

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function cargarRegistros() {
  const { data, error } = await supabase
    .from("usuario_verificaciones")
    .select("*");

  if (error) {
    alert("❌ Error al leer datos: " + error.message);
    console.error(error);
    return;
  }

  const tabla = document.getElementById("tabla");
  tabla.innerHTML = "";

  data.forEach(reg => {
    tabla.innerHTML += `
      <tr>
        <td>${reg.id}</td>
        <td>${reg.usuario}</td>
        <td>${reg.cuenta}</td>
        <td>${reg.iban}</td>
        <td><img src="${reg.frontal}"></td>
        <td><img src="${reg.trasera}"></td>
        <td><img src="${reg.domicilio}"></td>
        <td><img src="${reg.finanzas}"></td>
        <td>${reg.fecha}</td>
      </tr>
    `;
  });
}

cargarRegistros();
</script>

</body>
</html>
