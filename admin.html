<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Panel de Verificación Bancaria</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>
  body {
    font-family: Arial, sans-serif;
    background: #f5f7fa;
    margin: 0;
    padding: 0;
  }

  header {
    background: #003366;
    color: white;
    padding: 20px;
    font-size: 22px;
    font-weight: bold;
  }

  .container {
    width: 90%;
    margin: auto;
    padding-top: 20px;
  }

  .card {
    background: white;
    padding: 20px;
    margin-bottom: 25px;
    border-radius: 10px;
    box-shadow: 0px 3px 10px rgba(0,0,0,0.1);
  }

  .card h3 {
    margin-top: 0;
    color: #003366;
  }

  .info {
    margin-bottom: 10px;
    font-size: 15px;
  }

  .photos img {
    width: 220px;
    border-radius: 8px;
    margin-right: 10px;
    margin-top: 10px;
    border: 1px solid #ccc;
  }

  .btn {
    padding: 10px 15px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    margin-right: 10px;
    font-size: 14px;
  }

  .approve {
    background: #2e8b57;
    color: white;
  }

  .reject {
    background: #b22222;
    color: white;
  }

  .status {
    padding: 6px 10px;
    border-radius: 6px;
    font-weight: bold;
    display: inline-block;
  }

  .pendiente { background: #ffcc00; }
  .aprobado { background: #2e8b57; color: white; }
  .rechazado { background: #b22222; color: white; }
</style>

</head>
<body>

<header>Panel de Verificación Bancaria</header>

<div class="container" id="lista"></div>

<script>
const supabase = supabase.createClient(
  "TU_URL_SUPABASE",
  "TU_ANON_KEY"
);

async function cargar() {
  const { data } = await supabase
    .from("usuario_verificaciones")
    .select("*")
    .order("fecha", { ascending: false });

  let html = "";

  data.forEach(u => {
    html += `
      <div class="card">
        <h3>Usuario: ${u.usuario}</h3>

        <div class="info">Cuenta: <b>${u.cuenta}</b></div>
        <div class="info">IBAN: <b>${u.iban}</b></div>
        <div class="info">Fecha: ${u.fecha}</div>

        <div class="info">
          Estado:
          <span class="status ${u.estado}">${u.estado.toUpperCase()}</span>
        </div>

        <div class="photos">
          <h4>Documentos</h4>
          <img src="https://TU_URL_SUPABASE/storage/v1/object/public/verificacion/${u.frontal_url}">
          <img src="https://TU_URL_SUPABASE/storage/v1/object/public/verificacion/${u.trasera_url}">
          <img src="https://TU_URL_SUPABASE/storage/v1/object/public/verificacion/${u.domicilio_url}">
          <img src="https://TU_URL_SUPABASE/storage/v1/object/public/verificacion/${u.finanzas_url}">
        </div>

        <br>

        <button class="btn approve" onclick="actualizarEstado('${u.id}','aprobado')">Aprobar</button>
        <button class="btn reject" onclick="actualizarEstado('${u.id}','rechazado')">Rechazar</button>
      </div>
    `;
  });

  document.getElementById("lista").innerHTML = html;
}

async function actualizarEstado(id, estado) {
  await supabase
    .from("usuario_verificaciones")
    .update({ estado })
    .eq("id", id);

  cargar();
}

cargar();
</script>

</body>
</html>
