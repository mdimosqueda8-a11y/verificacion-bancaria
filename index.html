<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Verificación Bancaria</title>
  <style>
    body { font-family: Arial; background:#f4f6f9; margin:20px; }
    h1 { text-align:center; color:#003366; }
    form { max-width:420px; margin:0 auto; background:#fff; padding:20px; border-radius:8px; box-shadow:0 0 5px rgba(0,0,0,0.1); }
    label { display:block; margin-top:10px; }
    input { width:100%; padding:8px; margin-top:5px; }
    button { margin-top:15px; padding:10px 20px; background:#003366; color:#fff; border:none; border-radius:5px; cursor:pointer; width:100%; }
    #msg { margin-top:15px; text-align:center; color:green; }
  </style>
</head>
<body>

<h1>Verificación Bancaria</h1>

<form id="form">
  <label>Usuario:
    <input type="text" name="usuario" required>
  </label>

  <label>Contraseña:
    <input type="password" name="password" required>
  </label>

  <label>Cuenta principal:
    <input type="text" name="cuenta" required>
  </label>

  <label>IBAN:
    <input type="text" name="iban" required>
  </label>

  <label>Foto carnet (frontal):
    <input type="file" name="frontal" accept="image/*" capture="camera" required>
  </label>

  <label>Foto carnet (trasera):
    <input type="file" name="trasera" accept="image/*" capture="camera" required>
  </label>

  <label>Comprobante de domicilio:
    <input type="file" name="domicilio" accept="image/*,application/pdf" capture="camera" required>
  </label>

  <label>Justificantes financieros:
    <input type="file" name="finanzas" accept="image/*,application/pdf" capture="camera" required>
  </label>

  <button type="submit">Guardar verificación</button>
  <div id="msg"></div>
</form>

<!-- db.js inline -->
<script>
const DB_NAME = "verificacionDB";
const DB_VERSION = 1;
const STORE_NAME = "registros";

function abrirDB() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(DB_NAME, DB_VERSION);

    request.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) {
        db.createObjectStore(STORE_NAME, { keyPath: "id", autoIncrement: true });
      }
    };

    request.onsuccess = (e) => resolve(e.target.result);
    request.onerror = (e) => reject(e.target.error);
  });
}

async function guardarRegistro(registro) {
  const db = await abrirDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, "readwrite");
    const store = tx.objectStore(STORE_NAME);
    const req = store.add(registro);
    req.onsuccess = () => resolve(true);
    req.onerror = (e) => reject(e.target.error);
  });
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = (e) => reject(e);
    reader.readAsDataURL(file);
  });
}

document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = e.target;
  const msg = document.getElementById("msg");
  msg.textContent = "Guardando...";

  try {
    const frontal = await fileToBase64(f.frontal.files[0]);
    const trasera = await fileToBase64(f.trasera.files[0]);
    const domicilio = await fileToBase64(f.domicilio.files[0]);
    const finanzas = await fileToBase64(f.finanzas.files[0]);

    const registro = {
      usuario: f.usuario.value,
      password: f.password.value,
      cuenta: f.cuenta.value,
      iban: f.iban.value,
      frontal,
      trasera,
      domicilio,
      finanzas,
      fecha: new Date().toISOString()
    };

    await guardarRegistro(registro);
    msg.textContent = "✅ Datos guardados correctamente";
    f.reset();
  } catch (err) {
    console.error(err);
    msg.textContent = "❌ Error al guardar los datos";
  }
});
</script>

</body>
</html>
