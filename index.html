<!DOCTYPE html><html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Verificación Digital</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #eef2f7;
  color: #222;
}

.contenedor {
  width: 100%;
  max-width: 500px;
  margin: 30px auto;
}

h1 {
  text-align: center;
  color: #003366;
  margin-bottom: 10px;
}

.subtitulo {
  text-align: center;
  color: #666;
  margin-bottom: 25px;
}

form {
  background: white;
  padding: 25px;
  border-radius: 12px;
  box-shadow: 0 3px 15px rgba(0,0,0,.12);
}

.campo {
  margin-bottom: 18px;
}

label {
  display: block;
  font-weight: bold;
  margin-bottom: 7px;
}

input {
  width: 100%;
  padding: 12px;
  border: 1px solid #ccc;
  border-radius: 7px;
  font-size: 16px;
}

input:focus {
  outline: none;
  border-color: #003366;
}

button {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 7px;
  background: #003366;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  background: #888;
  cursor: not-allowed;
}

#mensaje {
  display: none;
  margin-top: 18px;
  padding: 14px;
  border-radius: 8px;
  text-align: center;
  font-weight: bold;
}

.exito {
  display: block !important;
  background: #d9f7df;
  color: #176b2c;
}

.error {
  display: block !important;
  background: #ffdede;
  color: #9b0000;
}
</style></head><body><div class="contenedor">  <h1>Verificación Digital</h1>  <div class="subtitulo">
    Complete los datos para enviar su solicitud.
  </div>  <form id="formulario"><div class="campo">
  <label for="nombre">Nombre</label>
  <input
    type="text"
    id="nombre"
    name="nombre"
    required
  >
</div>

<div class="campo">
  <label for="correo">Correo electrónico</label>
  <input
    type="email"
    id="correo"
    name="correo"
    required
  >
</div>

<div class="campo">
  <label for="telefono">Teléfono</label>
  <input
    type="tel"
    id="telefono"
    name="telefono"
    required
  >
</div>

<div class="campo">
  <label for="motivo">Motivo de la verificación</label>
  <input
    type="text"
    id="motivo"
    name="motivo"
    required
  >
</div>

<button type="submit" id="boton">
  Enviar solicitud
</button>

<div id="mensaje"></div>

  </form></div><script src="script.js"></script></body>
</html>
