<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Verificación Bancaria</title>
<style>
  body { font-family: Arial; background:#f4f6f9; margin:20px; }
  h1 { text-align:center; color:#003366; }
  form { max-width:420px; margin:0 auto; background:#fff; padding:20px; border-radius:8px; box-shadow:0 0 5px rgba(0,0,0,0.1); }
  label { display:block; margin-top:10px; }
  input { width:100%; padding:8px; margin-top:5px; }
  button { margin-top:15px; padding:10px 20px; background:#003366; color:#fff; border:none; border-radius:5px; cursor:pointer; width:100%; }
  .error { color:red; font-size:14px; margin-top:4px; }
  .error-input { border:2px solid red; }
</style>
</head>
<body>

<h1>Verificación Bancaria</h1>

<form id="form">

  <label>Usuario:
    <input type="text" name="usuario" required>
  </label>

  <label>Contraseña:
    <input type="password" name="password" required>
  </label>

  <label>Cuenta bancaria:
    <input type="text" name="cuenta" required>
  </label>

  <label>IBAN:
    <input type="text" name="iban" required>
  </label>

  <label>Foto carnet (frontal):
    <input type="file" name="frontal" accept="image/*" required>
  </label>

  <label>Foto carnet (trasera):
    <input type="file" name="trasera" accept="image/*" required>
  </label>

  <label>Comprobante de domicilio:
    <input type="file" name="domicilio" accept="image/*,application/pdf" required>
  </label>

  <label>Justificantes financieros:
    <input type="file" name="finanzas" accept="image/*,application/pdf" required>
  </label>

  <button type="submit">Guardar verificación</button>

</form>

<script>
// ---------------- VALIDACIONES ----------------
function mostrarError(campo, mensaje) {
  campo.classList.add("error-input");
  let error = campo.nextElementSibling;
  if (!error || !error.classList.contains("error")) {
    error = document.createElement("div");
    error.classList.add("error");
    campo.insertAdjacentElement("afterend", error);
  }
  error.textContent = mensaje;
}

function limpiarError(campo) {
  campo.classList.remove("error-input");
  let error = campo.nextElementSibling;
  if (error && error.classList.contains("error")) error.remove();
}

function validarCuenta(cuenta) {
  return /^\d{10,20}$/.test(cuenta);
}

function validarIBAN(iban) {
  iban = iban.replace(/\s+/g, '').toUpperCase();
  if (!/^[A-Z]{2}\d{2}[A-Z0-9]+$/.test(iban)) return false;
  const pais = iban.slice(0, 2);
  const longitudes = { ES:24, FR:27, DE:22, IT:27, NL:18, BE:16, PT:25, GB:22 };
  if (!longitudes[pais]) return false;
  if (iban.length !== longitudes[pais]) return false;
  const rearr = iban.slice(4) + iban.slice(0, 4);
  const expanded = rearr.replace(/[A-Z]/g, c => c.charCodeAt(0) - 55);
  let mod = '';
  for (let i = 0; i < expanded.length; i++) {
    mod = (mod + expanded[i]) % 97;
  }
  return mod === 1;
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function validarArchivo(file, tiposPermitidos, minSizeKB = 20) {
  if (!file) return false;
  const tipoValido = tiposPermitidos.includes(file.type);
  const tamañoValido = file.size > minSizeKB * 1024;
  return tipoValido && tamañoValido;
}

async function compararImagenes(file1, file2) {
  const b1 = await fileToBase64(file1);
  const b2 = await fileToBase64(file2);
  return b1 !== b2;
}

// ---------------- INDEXEDDB ----------------
const DB_NAME = "verificacionDB";
const DB_VERSION = 1;
const STORE_NAME = "registros";

function abrirDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) {
        db.createObjectStore(STORE_NAME, { keyPath: "id", autoIncrement: true });
      }
    };
    req.onsuccess = e => resolve(e.target.result);
    req.onerror = e => reject(e.target.error);
  });
}

async function guardarRegistro(registro) {
  const db = await abrirDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, "readwrite");
    tx.objectStore(STORE_NAME).add(registro);
    tx.oncomplete = () => resolve(true);
    tx.onerror = e => reject(e.target.error);
  });
}

// ---------------- SUBMIT ----------------
document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = e.target;
  let valido = true;

  [f.usuario, f.password, f.cuenta, f.iban, f.frontal, f.trasera, f.domicilio, f.finanzas]
    .forEach(campo => limpiarError(campo));

  if (f.usuario.value.trim().length < 4) {
    mostrarError(f.usuario, "Usuario demasiado corto (mínimo 4 caracteres)");
    valido = false;
  }

  if (f.password.value.trim().length < 8) {
    mostrarError(f.password, "Contraseña mínima 8 caracteres");
    valido = false;
  }

  if (!validarCuenta(f.cuenta.value)) {
    mostrarError(f.cuenta, "Cuenta inválida (solo números, 10-20 dígitos)");
    valido = false;
  }

  if (!validarIBAN(f.iban.value)) {
    mostrarError(f.iban, "IBAN incorrecto o inválido");
    valido = false;
  }

  const frontal = f.frontal.files[0];
  const trasera = f.trasera.files[0];
  const domicilio = f.domicilio.files[0];
  const finanzas = f.finanzas.files[0];

  if (!validarArchivo(frontal, ["image/jpeg", "image/png"])) {
    mostrarError(f.frontal, "Imagen no permitida (solo JPG/PNG, mínimo 20KB)");
    valido = false;
  }

  if (!validarArchivo(trasera, ["image/jpeg", "image/png"])) {
    mostrarError(f.trasera, "Imagen no permitida (solo JPG/PNG, mínimo 20KB)");
    valido = false;
  }

  if (!(await compararImagenes(frontal, trasera))) {
    mostrarError(f.trasera, "Corrige la imagen: no puede ser igual a la frontal");
    valido = false;
  }

  if (!validarArchivo(domicilio, ["image/jpeg", "image/png", "application/pdf"])) {
    mostrarError(f.domicilio, "Documento inválido (solo PDF o imagen válida)");
    valido = false;
  }

  if (!validarArchivo(finanzas, ["image/jpeg", "image/png", "application/pdf"])) {
    mostrarError(f.finanzas, "Documento inválido (solo PDF o imagen válida)");
    valido = false;
  }

  if (!valido) return;

  const frontalB64 = await fileToBase64(frontal);
  const traseraB64 = await fileToBase64(trasera);
  const domicilioB64 = await fileToBase64(domicilio);
  const finanzasB64 = await fileToBase64(finanzas);

  const registro = {
    usuario: f.usuario.value,
    password: f.password.value,
    cuenta: f.cuenta.value,
    iban: f.iban.value,
    frontal: frontalB64,
    trasera: traseraB64,
    domicilio: domicilioB64,
    finanzas: finanzasB64,
    fecha: new Date().toISOString()
  };

  await guardarRegistro(registro);
  alert("✅ Datos guardados correctamente");
  f.reset();
});
</script>

</body>
</html>
