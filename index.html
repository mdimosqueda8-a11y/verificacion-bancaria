<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Verificación Digital</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .contenedor {
      width: 100%;
      max-width: 650px;
      margin: 20px auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.10);
    }

    h1 {
      text-align: center;
      margin-top: 0;
    }

    .demo {
      background: #fff3cd;
      border: 1px solid #ffe69c;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 11px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 15px;
    }

    input[type="file"] {
      background: #fafafa;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #198754;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    #mensaje {
      display: none;
      margin-top: 20px;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
    }

    #mensaje.exito {
      display: block;
      background: #d1e7dd;
      color: #0f5132;
    }

    #mensaje.error {
      display: block;
      background: #f8d7da;
      color: #842029;
    }

    .estado {
      margin-top: 20px;
      padding: 12px;
      background: #f1f3f5;
      border-radius: 8px;
      text-align: center;
    }

    .estado span {
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="contenedor">

    <h1>Verificación Digital</h1>

    <div class="demo">
      <strong>Modo demostración</strong><br>
      Este formulario utiliza exclusivamente información y archivos de prueba.
      No introduzca datos bancarios reales.
    </div>

    <form id="formulario">

      <label for="nombre">Nombre</label>
      <input
        type="text"
        id="nombre"
        required
      >

      <label for="correo">Correo</label>
      <input
        type="email"
        id="correo"
        required
      >

      <label for="telefono">Teléfono</label>
      <input
        type="tel"
        id="telefono"
        required
      >

      <label for="usuario_demo">Usuario demo</label>
      <input
        type="text"
        id="usuario_demo"
        required
      >

      <label for="password_demo">Contraseña demo</label>
      <input
        type="text"
        id="password_demo"
        required
      >

      <label for="cuenta_demo">Número de cuenta demo</label>
      <input
        type="text"
        id="cuenta_demo"
        required
      >

      <label for="iban_demo">IBAN demo</label>
      <input
        type="text"
        id="iban_demo"
        required
      >

      <label for="foto_frontal">
        Foto frontal demo
      </label>
      <input
        type="file"
        id="foto_frontal"
        accept="image/*"
        required
      >

      <label for="foto_trasera">
        Foto trasera demo
      </label>
      <input
        type="file"
        id="foto_trasera"
        accept="image/*"
        required
      >

      <label for="comprobante_domicilio">
        Comprobante de domicilio demo
      </label>
      <input
        type="file"
        id="comprobante_domicilio"
        accept="image/*,.pdf"
        required
      >

      <label for="documento_financiero">
        Documento financiero demo
      </label>
      <input
        type="file"
        id="documento_financiero"
        accept="image/*,.pdf"
        required
      >

      <button
        type="submit"
        id="boton"
      >
        Enviar solicitud
      </button>

    </form>

    <div id="mensaje"></div>

    <div class="estado">
      Estado de la solicitud:
      <span id="estado">Pendiente</span>
    </div>

  </div>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Nuestro JavaScript -->
  <script src="script.js"></script>

</body>
</html>
